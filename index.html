<style>
/* Layout: phone-first app shell — sticky header, single column, fixed tab bar at the bottom */
:root{
  --bg:#EDF1EE; --surface:#FAFCFA; --sunk:#E2E8E4; --ink:#16201D; --muted:#596661; --line:#CFD8D3;
  --accent:#2C4C9E; --accent-soft:#DCE4F6; --on-accent:#FFFFFF;
  --gold:#A86C12; --gold-soft:#F4E6CC; --good:#2B7A4B; --good-soft:#D7EEDF; --bad:#B03838; --bad-soft:#F6DADA;
  --f-ui:"Readex Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ar:"Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171E1C; --sunk:#202A27; --ink:#E4EBE8; --muted:#94A39D; --line:#2B3633;
  --accent:#93AAEE; --accent-soft:#1F2A47; --on-accent:#0D1430;
  --gold:#E3AC52; --gold-soft:#3A2D16; --good:#6EC290; --good-soft:#173324; --bad:#E58080; --bad-soft:#3A1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171E1C; --sunk:#202A27; --ink:#E4EBE8; --muted:#94A39D; --line:#2B3633;
  --accent:#93AAEE; --accent-soft:#1F2A47; --on-accent:#0D1430;
  --gold:#E3AC52; --gold-soft:#3A2D16; --good:#6EC290; --good-soft:#173324; --bad:#E58080; --bad-soft:#3A1C1C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
header.top h1{font-size:20px;font-weight:600;margin:0;flex:1;min-width:0;text-wrap:balance}
.back{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.sync{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud .dot{background:var(--good)}
.ar{font-family:var(--f-ar);direction:rtl;line-height:1.9}
.ai{font-family:var(--f-ar);font-size:1.22em;line-height:1.7}
.tline{margin:0;line-height:1.75}
.tline.arl{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:21px;line-height:1.9}
.exi{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.exi:first-of-type{border-top:0}
.exa{border-left:3px solid var(--good);padding:2px 10px;background:color-mix(in srgb,var(--good) 9%,transparent);border-radius:6px}
select.sel{font:inherit;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:17px;font-weight:600;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:500;cursor:pointer;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.back:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.ar{font-size:17px;padding:3px 13px;line-height:1.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input.ar,textarea.ar{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .ar{font-size:26px;line-height:1.5;font-weight:600;text-align:left}
.tile.soon{opacity:.55;cursor:default}
.tile .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.stat b{font-size:28px;font-weight:600}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.good{background:var(--good-soft);color:var(--good)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .ar{font-size:20px;line-height:1.6}
.ic{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ic:hover{background:var(--sunk)}
.ic svg,.back svg,.tab svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* review card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:240px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.card .big{font-size:34px;line-height:1.8}
.card .ans{border-top:1px dashed var(--line);padding-top:14px;width:100%}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:10px 6px}
.grades small{font-size:11px;opacity:.75;font-weight:400}
.g0{background:var(--bad-soft);color:var(--bad)}
.g1{background:var(--gold-soft);color:var(--gold)}
.g2{background:var(--good-soft);color:var(--good)}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
/* sarf table */
.ctable{width:100%;border-collapse:collapse}
.ctable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctable tr:last-child td{border-bottom:0}
.ctable .p{font-family:var(--f-ar);font-size:17px;color:var(--muted);text-align:right;white-space:nowrap;width:1%}
.ctable .p small{font-size:12px}
.ctable .v{font-family:var(--f-ar);font-size:24px;text-align:right;direction:rtl}
.ctable .s{width:1%}
.ctable tr.sep td{border-bottom:2px solid var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;font-family:var(--f-ar);font-size:24px;cursor:pointer;min-height:64px;direction:rtl}
.opt.fr{font-family:var(--f-ui);font-size:16px;direction:ltr}
.words{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;min-height:58px;align-content:flex-start}
.slot{border:1px dashed var(--line);border-radius:14px;padding:10px;min-height:64px}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.who{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--sunk);margin-top:6px}
.line.me .who{background:var(--accent);color:var(--on-accent)}
.hid{background:var(--sunk);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:14px;border:0;text-align:left}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg .ar{font-size:21px;line-height:1.8}
.corr{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;align-self:stretch;font-size:14px;display:flex;flex-direction:column;gap:4px}
.corr .ar{font-size:19px}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.composer .row{flex-wrap:nowrap}
.composer input{flex:1;min-width:0}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .ar{font-size:30px;color:var(--muted)}
details summary{cursor:pointer;font-weight:500;padding:4px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;cursor:pointer;font-size:14px;min-width:0}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.seg .ar{font-size:17px;line-height:1.4}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

"La mère a été triste du départ de son fils."],["لِمَاذَا تَحْزَنِينَ؟","Pourquoi es-tu triste ? (à une fille)"]],"17":[["نِمْتُ مُبَكِّرًا الْبَارِحَةَ.","Je me suis couché tôt hier soir."],["مَتَى تَنَامُ عَادَةً؟","Quand dors-tu habituellement ?"],["نَامَ الطِّفْلُ فِي السَّيَّارَةِ.","L'enfant s'est endormi dans la voiture."],["نَمْ عَلَى جَنْبِكَ الْأَيْمَنِ.","Dors sur ton côté droit."],["لَمْ أَنَمْ جَيِّدًا هَذِهِ اللَّيْلَةَ.","Je n'ai pas bien dormi cette nuit."]],"18":[["سَافَرْتُ إِلَى مِصْرَ فِي الصَّيْفِ.","J'ai voyagé en Égypte en été."],["يُسَافِرُ أَبِي كَثِيرًا لِلْعَمَلِ.","Mon père voyage beaucoup pour le travail."],["مَتَى تُسَافِرُونَ؟","Quand voyagez-vous ?"],["سَافَرْنَا بِالْقِطَارِ.","Nous avons voyagé en train."],["سَأُسَافِرُ بَعْدَ الِامْتِحَانَاتِ.","Je voyagerai après les examens."]],"19":[["أَكَلْتُ الْخُبْزَ وَالْجُبْنَ فِي الْفُطُورِ.","J'ai mangé du pain et du fromage au petit-déjeuner."],["مَاذَا تَأْكُلُ فِي الْغَدَاءِ؟","Que manges-tu au déjeuner ?"],["كُلْ بِيَمِينِكَ.","Mange avec ta main droite."],["لَا آكُلُ اللَّحْمَ كَثِيرًا.","Je ne mange pas beaucoup de viande."],["سَنَأْكُلُ فِي الْمَطْعَمِ اللَّيْلَةَ.","Nous mangerons au restaurant ce soir."]],"20":[["سَبَحْتُ فِي الْبَحْرِ سَاعَةً.","J'ai nagé une heure dans la mer."],["هَلْ تَسْبَحُ جَيِّدًا؟","Nages-tu bien ?"],["يَسْبَحُ السَّمَكُ فِي الْمَاءِ.","Les poissons nagent dans l'eau."],["اِسْبَحْ قَرِيبًا مِنَ الشَّاطِئِ.","Nage près du rivage."],["سَوْفَ نَسْبَحُ فِي الْمَسْبَحِ غَدًا.","Nous nagerons à la piscine demain."]],"21":[["قَفَزَ الْوَلَدُ فَوْقَ الْحَائِطِ.","L'enfant a sauté par-dessus le muret."],["أَقْفِزُ بِالْحَبْلِ كُلَّ صَبَاحٍ.","Je saute à la corde chaque matin."],["! لَا تَقْفِزْ مِنَ النَّافِذَةِ!","Ne saute pas par la fenêtre"],["قَفَزَتِ الْقِطَّةُ عَلَى الطَّاوِلَةِ.","La chatte a sauté sur la table."],["سَنَقْفِزُ فِي الْمَاءِ مَعًا.","Nous sauterons dans l'eau ensemble."]],"22":[["صَرَخَ الطِّفْلُ لَمَّا رَأَى الْكَلْبَ.","L'enfant a crié quand il a vu le chien."],["لَا تَصْرُخْ، أَخُوكَ نَائِمٌ.","Ne crie pas, ton frère dort."],["يَصْرُخُ النَّاسُ فِي الْمَلْعَبِ.","Les gens crient au stade."],["صَرَخْتُ مِنَ الْأَلَمِ.","J'ai crié de douleur."],["لِمَاذَا تَصْرُخِينَ؟","Pourquoi cries-tu ? (à une fille)"]],"23":[["عَبَسَ الرَّجُلُ فِي وَجْهِ الْبَائِعِ.","L'homme a froncé les sourcils face au vendeur."],["لَا تَعْبِسْ فِي وَجْهِ أَخِيكَ.","Ne fais pas la tête à ton frère."],["يَعْبِسُ أَبِي عِنْدَمَا يَغْضَبُ.","Mon père fronce les sourcils quand il se fâche."],["عَبَسْتُ لِأَنَّ الطَّعَامَ بَارِدٌ.","J'ai fait la grimace car la nourriture était froide."],["لِمَاذَا عَبَسْتَ؟","Pourquoi as-tu froncé les sourcils ?"]],"24":[["تَفَوَّقَ أَخِي فِي الرِّيَاضِيَّاتِ.","Mon frère a excellé en maths."],["أَتَفَوَّقُ فِي الدِّرَاسَةِ إِذَا اجْتَهَدْتُ.","J'excelle dans les études quand je fais des efforts."],["تَفَوَّقَتْ أُخْتِي عَلَى زُمَلَائِهَا.","Ma sœur a surpassé ses camarades."],["سَيَتَفَوَّقُ مَنْ يَعْمَلُ بِجِدٍّ.","Celui qui travaille sérieusement excellera."],["تَفَوَّقْنَا فِي الْمُسَابَقَةِ.","Nous avons excellé au concours."]],"25":[["هَرَبَ السَّارِقُ مِنَ الشُّرْطَةِ.","Le voleur s'est enfui devant la police."],["يَهْرُبُ الْفَأْرُ مِنَ الْقِطِّ.","La souris fuit le chat."],["لَا تَهْرُبْ مِنَ الْمَسْؤُولِيَّةِ.","Ne fuis pas tes responsabilités."],["هَرَبْنَا مِنَ الْمَطَرِ إِلَى الْمَسْجِدِ.","Nous avons fui la pluie jusqu'à la mosquée."],["هَرَبَتِ الدَّجَاجَةُ مِنَ الْقَفَصِ .","La poule s'est échappée de la cage."]],"26":[["اِنْصَرَفَ الطُّلَّابُ بَعْدَ الدَّرْسِ .","Les élèves sont partis après le cours."],["أَنْصَرِفُ إِلَى الْبَيْتِ فِي الْخَامِسَةِ.","Je rentre à la maison à cinq heures."],["لَا تَنْصَرِفْ قَبْلَ أَنْ تُسَلِّمَ.","Ne pars pas avant de saluer."],["اِنْصَرَفَ الضُّيُوفُ مُتَأَخِّرِينَ.","Les invités sont partis tard."],["مَتَى تَنْصَرِفُونَ؟","Quand partez-vous ?"]],"27":[["عَثَرْتُ عَلَى مِفْتَاحِي تَحْتَ السَّرِيرِ.","J'ai trouvé ma clé sous le lit."],["عَثَرَ الرَّ "سَكَنَتْ عَائِلَتِي فِي الْقَرْيَةِ.","Ma famille a habité au village."],["سَنَسْكُنُ فِي بَيْتٍ جَدِيدٍ.","Nous habiterons dans une nouvelle maison."]],"54":[["عَلَّمَنِي أَبِي السِّبَاحَةَ.","Mon père m'a appris à nager."],["يُعَلِّمُ الشَّيْخُ الْأَطْفَالَ الْقُرْآنَ.","Le cheikh enseigne le Coran aux enfants."],["عَلِّمْ أَخَاكَ مَا تَعَلَّمْتَ.","Enseigne à ton frère ce que tu as appris."],["عَلَّمَتْنَا الْمُعَلِّمَةُ الْحُرُوفَ.","L'enseignante nous a appris les lettres."],["سَأُعَلِّمُكَ الْعَرَبِيَّةَ.","Je t'apprendrai l'arabe."]],"55":[["نَزَلْتُ مِنَ الْحَافِلَةِ أَمَامَ الْمَدْرَسَةِ.","Je suis descendu du bus devant l'école."],["نَزَلَ الْمَطَرُ بِغَزَارَةٍ.","La pluie est tombée abondamment."],["! اِنْزِلْ مِنَ الشَّجَرَةِ!","Descends de l'arbre"],["نَزَلَ الْقُرْآنُ فِي رَمَضَانَ.","Le Coran est descendu en Ramadan."],["سَنَنْزِلُ فِي فُنْدُقٍ صَغِيرٍ.","Nous logerons dans un petit hôtel."]],"56":[["خَرَجْتُ مِنَ الْبَيْتِ مُبَكِّرًا.","Je suis sorti de la maison tôt."],["خَرَجَ عَبَّاسٌ.","Abbas est sorti."],["اُخْرُجْ مِنَ الْغُرْفَةِ مِنْ فَضْلِكَ.","Sors de la pièce, s'il te plaît."],["يَخْرُجُ أَبِي إِلَى الْعَمَلِ فِي السَّابِعَةِ.","Mon père part au travail à sept heures."],["لَا تَخْرُجْ فِي الْبَرْدِ بِدُونِ مِعْطَفٍ.","Ne sors pas dans le froid sans manteau."]],"57":[["وَقَعَ الْكِتَابُ مِنَ الطَّاوِلَةِ.","Le livre est tombé de la table."],["وَقَعْتُ فِي الشَّارِعِ.","Je suis tombé dans la rue."],["وَقَعَتْ حَادِثَةٌ أَمَامَ الْمَدْرَسَةِ.","Un accident a eu lieu devant l'école."],["اِنْتَبِهْ حَتَّى لَا تَقَعَ.","Fais attention pour ne pas tomber."],["تَقَعُ مَكَّةُ فِي الْحِجَازِ.","La Mecque se trouve au Hijaz."]],"58":[["عَلِمْتُ الْخَبَرَ مِنْ أَخِي.","J'ai appris la nouvelle par mon frère."],["اللهُ يَعْلَمُ كُلَّ شَيْءٍ.","Allah sait toute chose."],["هَلْ تَعْلَمُ أَيْنَ الْمُدِيرُ؟","Sais-tu où est le directeur ?"],["لَا أَعْلَمُ الْجَوَابَ.","Je ne connais pas la réponse."],["عَلِمَتْ أُمِّي بِنَجَاحِي.","Ma mère a appris ma réussite."]],"59":[["حَفِظْتُ سُورَةَ الْمُلْكِ.","J'ai appris la sourate al-Moulk par cœur."],["يَحْفَظُ الطَّالِبُ عَشَرَةَ أَفْعَالٍ كُلَّ يَوْمٍ.","L'élève mémorise dix verbes chaque jour."],["اِحْفَظْ هَذِهِ الْكَلِمَاتِ.","Apprends ces mots par cœur."],["حَفِظَ اللهُ بِلَادَنَا.","Qu'Allah protège notre pays."],["سَأَحْفَظُ الدَّرْسَ قَبْلَ النَّوْمِ.","J'apprendrai la leçon avant de dormir."]],"60":[["رَسَبَ الطَّالِبُ الْكَسْلَانُ.","L'élève paresseux a échoué."],["لَمْ أَرْسُبْ أَبَدًا.","Je n'ai jamais échoué."],["رَسَبَ أَخِي فِي امْتِحَانِ الْقِيَادَةِ.","Mon frère a raté l'examen du permis."],["مَنْ لَا يَدْرُسُ يَرْسُبُ.","Celui qui n'étudie pas échoue."],["لَنْ تَرْسُبَ إِذَا اجْتَهَدْتَ.","Tu n'échoueras pas si tu fais des efforts."]],"61":[["رَقَصَ الْأَطْفَالُ فِي الْحَفْلَةِ.","Les enfants ont dansé à la fête."],["يَرْقُصُ الطِّفْلُ مِنَ الْفَرَحِ.","L'enfant danse de joie."],["رَقَصَتِ الْبِنْتُ الصَّغِيرَةُ.","La petite fille a dansé."],["لَا يَرْقُصُ أَبِي أَبَدًا.","Mon père ne danse jamais."],["رَقَصَ الْحِصَانُ أَمَامَ النَّاسِ .","Le cheval a dansé devant les gens."]],"62":[["حَضَرْتُ الدَّرْسَ كُلَّهُ.","J'ai assisté à tout le cours."],["هَلْ تَحْضُرُ الْحَفْلَةَ غَدًا؟","Viens-tu à la fête demain ?"],["حَضَرَ الضُّيُوفُ فِي الْوَقْتِ.","Les invités sont venus à l'heure."],["اُحْضُرْ صَلَاةَ الْجُمُعَةِ مُبَكِّرًا.","Assiste tôt à la prière du vendredi."],["حَضَرَتِ الطَّالِبَاتُ الْمُحَاضَرَةَ.","Les étudiantes ont assisté à la conférence."]],"63":[["وَجَدْتُ مِحْفَظَتِي فِي السَّيَّارَةِ.","J'ai trouvé mon portefeuille dans la voiture."],["لَا أَجِدُ قَلَمِي.","Je ne trouve pas mon stylo."],["وَجَدَ الطَّالِبُ الْجَوَابَ.","L'élève a trouvé la réponse."],["هَلْ وَجَدْتَ عَمَلًا؟","As-tu trouvé un travail ?"],["سَتَجِدُ الْكِتَابَ عَلَى الرَّفِّ.","Tu trouveras le livre sur l'étagère."]],"64":[["سَمِعْتُ الْأَذَانَ مِنْ بَيْتِي.","J'ai entendu l'appel à la prière depuis chez moi."],["هَلْ تَسْمَعُنِي؟","M'entends-tu ?"],["اِسْمَعْ كَلَامَ أَبِيكَ.","Écoute la parole de ton père."],["سَمِعْنَا خَبَرًا جَمِيلًا.","Nous avons entendu une belle nouvelle."],["لَمْ أَسْمَعْ جَيِّدًا، أَعِدْ مِنْ فَضْلِكَ.","Je n'ai pas bien entendu, répète s'il te plaît."]],"65":[["جَاءَ أَخِي مِنَ الْمَدْرَسَةِ.","Mon frère est venu de l'école."],["جِئْتُ مُتَأَخِّرًا، عُذْرًا.","Je suis venu en retard, désolé."],["مَتَى تَجِيءُ إِلَيْنَا؟","Quand viens-tu chez nous ?"],["جَاءَتِ الْمُعَلِّمَةُ إِلَى الْفَصْلِ.","L'enseignante est venue en classe."],["جَاءَ الشِّتَاءُ.","L'hiver est arrivé."]],"66":[["خَافَ الطِّفْلُ مِنَ الظَّلَامِ.","L'enfant a eu peur du noir."],["لَا تَخَفْ، أَنَا مَعَكَ.","N'aie pas peur, je suis avec toi."],["أَخَافُ مِنَ الْكِلَابِ.","J'ai peur des chiens."],["خِفْتُ أَنْ أَتَأَخَّرَ.","J'ai eu peur d'être en retard."],["خَفِ اللهَ فِي كُلِّ مَكَانٍ.","Crains Allah en tout lieu."]],"67":[["تَابَ الرَّجُلُ إِلَى اللهِ.","L'homme s'est repenti auprès d'Allah."],["تُبْ قَبْلَ أَنْ يَفُوتَ الْوَقْتُ.","Repens-toi avant qu'il ne soit trop tard."],["اللهُ يَقْبَلُ مَنْ يَتُوبُ.","Allah accepte celui qui se repent."],["تُبْنَا مِنْ ذُنُوبِنَا.","Nous nous sommes repentis de nos péchés."],["تَابَتِ الْمَرْأَةُ وَصَلَّتْ.","La femme s'est repentie et a prié."]],"68":[["طَلَبْتُ مِنَ الْبَائِعِ كِيسًا.","J'ai demandé un sac au vendeur."],["يَطْلُبُ الطَّالِبُ الْعِلْمَ.","L'étudiant recherche la science."],["اُطْلُبْ مِنَ اللهِ.","Demande à Allah."],["طَلَبَتْ أُمِّي مِنِّي الْمُسَاعَدَةَ.","Ma mère m'a demandé de l'aide."],["مَاذَا تَطْلُبُ فِي الْمَطْعَمِ؟","Que commandes-tu au restaurant ?"]],"69":[["تَرَكْتُ كِتَابِي فِي الْفَصْلِ.","J'ai laissé mon livre en classe."],["لَا تَتْرُكِ الصَّلَاةَ.","N'abandonne pas la prière."],["تَرَكَ أَخِي التَّدْخِينَ.","Mon frère a arrêté de fumer."],["يَتْرُكُ الطَّائِرُ عُشَّهُ فِي الشِّتَاءِ.","L'oiseau quitte son nid en hiver."],["اُتْرُكِ الْبَابَ مَفْتُوحًا.","Laisse la porte ouverte."]],"70":[["مَسَحْتُ الطَّاوِلَةَ بِالْقُمَاشِ .","J'ai essuyé la table avec le chiffon."],["نَمْسَحُ الرَّأْسَ فِي الْوُضُوءِ.","On passe la main sur la tête aux ablutions."],["اِمْسَحِ السَّبُّورَةَ.","Efface le tableau."],["مَسَحَتِ الْأُمُّ دُمُوعَ طِفْلِهَا.","La mère a essuyé les larmes de son enfant."],["يَمْسَحُ الْعَامِلُ الْبِلَاطَ.","L'ouvrier lave le carrelage."]],"71":[["نَجَحْتُ فِي الِامْتِحَانِ وَالْحَمْدُ لِلَّهِ.","J'ai réussi l'examen, louange à Allah."],["يَنْجَحُ مَنْ يَجْتَهِدُ.","Celui qui fait des efforts réussit."],["نَجَحَتْ أُخْتِي فِي الْبَكَالُورِيَا.","Ma sœur a eu son bac."],["سَتَنْجَحُ إِنْ شَاءَ اللهُ.","Tu réussiras, si Allah le veut."],["هَلْ نَجَحْتُمْ كُلُّكُمْ؟","Avez-vous tous réussi ?"]],"72":[["حَلَمْتُ أَنِّي فِي مَكَّةَ.","J'ai rêvé que j'étais à La Mecque."],["يَحْلُمُ الطِّفْلُ فِي اللَّيْلِ.","L'enfant rêve la nuit."],["بِمَاذَا حَلَمْتَ؟","De quoi as-tu rêvé ?"],["تَحْلُمُ أُخْتِي بِأَنْ تَكُونَ طَبِيبَةً.","Ma sœur rêve de devenir médecin."],["مَا حَلَمْتُ هَذِهِ اللَّيْلَةَ.","Je n'ai pas rêvé cette nuit."]],"73":[["لَوَّنَ الطِّفْلُ الشَّجَرَةَ بِالْأَخْضَرِ.","L'enfant a colorié l'arbre en vert."],["لَوِّنِ الصُّورَةَ.","Colorie l'image."],["تُلَوِّنُ الْبِنْتُ الزُّهُورَ.","La fille colorie les fleurs."],["لَوَّنْتُ الْجِدَارَ بِالْأَبْيَضِ .","J'ai peint le mur en blanc."],["سَنُلَوِّنُ الْغُرْفَةَ غَدًا.","Nous peindrons la chambre demain."]],"74":[["نَظَرْتُ إِلَى الْقَمَرِ.","J'ai regardé la lune."],["لِمَاذَا تَنْظُرُ إِلَيَّ؟","Pourquoi me regardes-tu ?"],["اُنْظُرْ إِلَى السَّبُّورَةِ.","Regarde le tableau."],["نَظَرَ الطَّبِيبُ إِلَى الْجُرْحِ.","Le médecin a examiné la blessure."],["يَنْظُرُ الطِّفْلُ مِنَ النَّافِذَةِ.","L'enfant regarde par la fenêtre."]],"75":[["قَرَأْتُ صَفْحَتَيْنِ مِنَ الْقُرْآنِ.","J'ai lu deux pages du Coran."],["اِقْرَأْ بِصَوْتٍ عَالٍ.","Lis à voix haute."],["أَقْرَأُ كُلَّ صَفْحَةٍ عِشْرِينَ مَرَّةً.","Je lis chaque page vingt fois."],["قَرَأَتْ أُخْتِي قِصَّةً لِلْأَطْفَالِ.","Ma sœur a lu une histoire aux enfants."],["هَلْ قَرَأْتَ هَذَا الْكِتَابَ؟","As-tu s de verbe « être » au présent. On met simplement هَذَا (ceci, pour une chose proche,","masculin) puis le nom.","هَذَا بَيْتٌ. Ceci est une maison.","هَذَا مَسْجِدٌ. Ceci est une mosquée.","هَذَا كُرْسِيٌّ. Ceci est une chaise.","⚠ هَذَا s'écrit avec un petit alif au-dessus du ه (on prononce « hâdhâ ») mais on ne l'écrit pas."]},{"t":"regle","n":"2","title":"Le tanwin ـٌ = « un / une »","lines":["Les deux dammas à la fin ـٌ( , prononcé « -oun ») indiquent un nom indéfini : « un » ou « une ». بَابٌ = « bâboun » =","une porte.","⚠ Sur كُرْسِيٌّ le tanwin se met sur le ي avec chadda : « koursiyyoun »."]},{"t":"regle","n":"3","title":"Poser la question مَا هَذَا؟ : ou مَنْ هَذَا؟","lines":["مَا = quoi ? pour une chose ou un animal. مَنْ = qui ? pour une personne. On répond avec هَذَا + le nom.","مَا هَذَا؟ هَذَا مِفْتَاحٌ. Qu'est-ce que c'est ? C'est une clé.","مَا هَذَا؟ هَذَا دِيكٌ. Qu'est-ce que c'est ? C'est un coq. (animal → (مَا","مَنْ هَذَا؟ هَذَا طَالِبٌ. Qui est-ce ? C'est un étudiant.",". مَنْ هَذَا؟ هَذَا مُدَرِّسٌ Qui est-ce ? C'est un enseignant."]},{"t":"regle","n":"4","title":"أَ = question « oui / non »","lines":["On colle أَ au début de la phrase → أَهَذَا … ؟ « Est-ce que c'est… ? ». On répond par نَعَمْ (oui) + la phrase, ou par لَا","(non) + la bonne réponse.","أَهَذَا بَيْتٌ؟ نَعَمْ، هَذَا بَيْتٌ. Est-ce une maison ? Oui, c'est une maison.","أَهَذَا سَرِيرٌ؟ لَا، هَذَا كُرْسِيٌّ. Est-ce un lit ? Non, c'est une chaise.","أَهَذَا حِمَارٌ؟ لَا، هَذَا حِصَانٌ. Est-ce un âne ? Non, c'est un cheval.","أَهَذَا وَلَدٌ؟ لَا، هَذَا رَجُلٌ. Est-ce un garçon ? Non, c'est un homme."]},{"t":"ex","n":1,"title":"Transforme en question oui/non","instr":"Ajoute أَ et le point d'interrogation.","items":[[1,"هَذَا بَابٌ.","أَهَذَا بَابٌ؟"],[2,"هَذَا قَلَمٌ.","أَهَذَا قَلَمٌ؟"],[3,"هَذَا طَبِيبٌ.","أَهَذَا طَبِيبٌ؟"],[4,"هَذَا جَمَلٌ.","أَهَذَا جَمَلٌ؟"],[5,"هَذَا مِنْدِيلٌ.","أَهَذَا مِنْدِيلٌ؟"]],"lines":[]},{"t":"ex","n":2,"title":"مَا — ou مَنْ ?","instr":"Complète s prénoms féminins",")زَيْنَبُ، مَرْيَمُ(","⚠ Astuce : les parties du corps qui vont par deux (yeux, oreilles, mains, pieds) sont féminines. أَنْفٌ et فَمٌ (un seul)","sont masculins."]},{"t":"regle","n":"20","title":"Accord : sujet féminin → خبر en ـَة","lines":["Si le sujet est féminin, le mot qui le décrit prend aussi ـَةٌ (p. 37) :","النَّافِذَةُ مُغْلَقَةٌ. ← الْبَابُ مُغْلَقٌ. La porte est fermée. ← La fenêtre est fermée.","فَاطِمَةُ طَبِيبَةٌ. ← حَامِدٌ طَبِيبٌ. Hamid est médecin. ← Fatima est médecin.","هِ مُسْلِمَةٌ. ← هُوَ مُسْلِمٌ. Il est musulman. ← Elle est musulmane.يَ","ابْنُ حَامِدٍ جَالِسٌ وَبِنْتُ يَاسِرٍ وَاقِفَةٌ. Le fils de Hamid est assis et la fille de Yasser debout.","هَذِهِ جَدِيدَةٌ وَدَرَّاجَةُ أَنَسٍ قَدِيمَةٌ. Celle-ci est neuve et le vélo d'Anas est vieux.","⚠ Même avec un féminin sans الشَّمْسُ جَمِيلَةٌ : ة · الْيَدُ وَسِخَةٌ · الْأُمُّ جَالِسَةٌ."]},{"t":"regle","n":"21","title":"لِمَنْ؟ = « à qui ? » → لِـ + nom à la kasra","lines":["لِـ (à, pour) se colle au nom, qui prend la kasra. Avec ,الـ le alif tombe لِلْمُدِيرِ : ← الْمُدِيرِ + .لِـ","لِمَنْ هَذِهِ؟ هَذِهِ لِخَالِدٍ. À qui est-ce ? C'est à Khalid.","هَذَا لِمُحَمَّدٍ وَذَلِكَ لِحَامِدٍ. Ceci est à Mohammed et cela à Hamid.","هَذِهِ السَّيَّارَةُ لِلطَّبِيبِ. Cette voiture est au médecin.","الْحَمْدُ لِلَّهِ. La louange est à Allah.","⚠ Deux façons de dire la même chose )إضافة( هَذَا كِتَابُ مُحَمَّدٍ : = ).لِـ( هَذَا الْكِتَابُ لِمُحَمَّدٍ"]},{"t":"ex","n":19,"title":"هَذَا — ou هَذِهِ ?","instr":"Dis la phrase avec le bon démonstratif.","items":[[1,"قَلَمٌ","هَذَا قَلَمٌ."],[2,"سَاعَةٌ","هَذِهِ سَاعَةٌ."],[3,"يَدٌ","هَذِهِ يَدٌ."],[4,"أَنْفٌ","هَذَا أَنْفٌ."],[5,"عَيْنٌ","هَذِهِ عَيْنٌ."],[6,"قِدْرٌ","هَذِهِ قِدْرٌ."],[7,"مِفْتَاحٌ","هَذَا مِفْتَاحٌ."],[8,"مِلْعَقَةٌ","هَذِهِ مِلْعَقَةٌ."],[9,"فَمٌ","هَذَا فَمٌ."],[10,"أُمٌّ","هَذِهِ أُمٌّ."],[11,"أُذُنٌ","هَذِهِ أُذُنٌ."],[12,"كُرْسِيٌّ","هَذَا كُرْسِيٌّ."]],"lines":[]},{"t":"ex","n":20,"title":"Mets au féminin (livre p. 3     if (tense === "sawfa") return T.mud.map(f => "سَوْفَ " + f);
    return T.mud.slice();
  }
  const P = parseVerb(v.madi, v.mudari); if (!P) return null;
  const [a, b, c] = P.r;
  if (tense === "madi") return MADI_SUF.map(s => a + "َ" + b + P.pv + c + s);
  if (tense === "lam") return MUD_PRE.map((pre, i) => "لَمْ " + pre + a + "ْ" + b + P.mv + c + JAZ_SUF[i]);
  if (tense === "amr") return PRON.map((p, i) => i >= 2 && i <= 7 ? (P.mv === "ُ" ? "اُ" : "اِ") + a + "ْ" + b + P.mv + c + JAZ_SUF[i] : "");
  const mud = MUD_PRE.map((pre, i) => pre + a + "ْ" + b + P.mv + c + MUD_SUF[i]);
  if (tense === "sa") return mud.map(f => "سَ" + f);
  if (tense === "sawfa") return mud.map(f => "سَوْفَ " + f);
  return mud;
}

/* filtre : "groupe␟thème␟section" */
const FS = "\u001f";
const fkey = (g, th, ss) => [g || "", th || "", ss || ""].join(FS);
function fmatch(c, fk){
  if (!fk) return true;
  if (!fk.includes(FS)) return (c.th || "Général") === fk;
  const [g, th, ss] = fk.split(FS);
  return (!g || c.g === g) && (!th || (c.th || "Général") === th) && (!ss || c.ss === ss);
}
const fresh_ok = (c, fk) => !c.lib || !!(fk && fk.split(FS).some(Boolean));
const srs = id => { const r = S.items["r-" + id]; return r && !r.x ? r : null; };
function counts(sp, th){
  const cs = cards(sp).filter(c => fmatch(c, th));
  const t = now(), newToday = live("srs").filter(r => r.fd === todayKey() && r.sp === sp).length;
  const due = cs.filter(c => { const r = srs(c.id); return r && r.due <= t; }).length;
  const fresh = cs.filter(c => !srs(c.id) && fresh_ok(c, th)).length;
  return {total: cs.length, due, fresh, newLeft: Math.max(0, Math.min(fresh, setting("newPerDay", 10) - newToday))};
}
function grade(card, g){
  const r = srs(card.id) || {k: "srs", sp: card.sp, box: 0, due: 0, fd: todayKey()};
  let box = r.box, due;
  if (g === 0) { box = 1; due = now() + 10 * 60e3; }
  else if (g === 1) { box = Math.max(1, box); due = now() + Math.max(0.5, IV[box] * 0.5) * DAY; }
  else { box = Math.min(IV.length - 1, box + 1); due = now() + IV[box] * DAY; }
  put("r-" + card.id, {...r, box, due});
}
function startSession(sp, th, test){
  const cs = cards(sp).filter(c => fmatch(c, th)), t = now();
  let queue;
  if (test) queue = shuffle(cs).map(c => c.id);
  else {
    const due = cs.filter(c => { const r = srs(c.id); return r && r.due <= t; }).sort((a, b) => srs(a.id).due - srs(b.id).due);
    const fresh = cs.filter(c => !srs(c.id) && fresh_ok(c, th)).slice(0, counts(sp, th).newLeft);
    queue = [...due, ...fresh].map(c => c.id);
  }
  if (!queue.length) { toast(test ? "Aucune carte dans ce thème." : "Rien à réviser pour l'instant."); return; }
  S.sess = {sp, th, queue, shown: false, done: 0, total: queue.length, rev: false, write: false, typed: "", from: S.view, test: !!test, wrong: [], saved: false,
    mode: test ? "qcm" : (sp === "ar" ? setting("arMode2", "flip") : "flip"), dir: test ? (sp === "ar" ? "mix" : "ar") : (sp === "ar" ? setting("arDir", "ar") : "ar"), curFor: null};
  go("review");
}

function studyPool(){
  const all = cards("ar"), st = S.deck.ar || {};

  if (studied.length >= 8) return studied;
  const fk = fkey(st.g, st.th, st.ss), cur = all.filter(c => fmatch(c, fk));
  return cur.length >= 8 ? cur : all;
}

const AR_RUN = /[؀-ۿ][؀-ۿً-ْٰ\s،؟.!:«»…ـ()\/=+]*[؀-ۿً-ْٰ؟]/g;
const hasLat = t => /[A-Za-zÀ-ÿ]/.test(t);
const rich = t => esc(t).replace(AR_RUN, m => `<bdi class="ai">${m}</bdi>`);
const tline = t => hasLat(t) ? `<p class="tline">${rich(t)}</p>` : `<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><p class="tline arl" style="flex:1">${esc(t)}</p>${spk(t)}</div>`;
const tLes = () => C.TAB[S.tl] || C.TAB[0];
VIEWS.tlist = () => `<div class="stack"><p class="muted small">Ton dossier « Taʿbīr — leçons 1 à 9 ». Méthode : 1 leçon = 3 séances (comprendre, s'entraîner, parler). Le texte a été extrait automatiquement du PDF : si une ligne est mal écrite, compare avec ton dossier papier.</p>
  ${C.TAB.map((l, i) => { const nr = l.blocks.filter(b => b.t === "regle").length, ne = l.blocks.filter(b => b.t === "ex").reduce((t, b) => t + b.items.length, 0);
    return `<button class="tile" data-a="tles" data-i="${i}" style="flex-direction:row;align-items:center;gap:12px"><span class="pill ${l.n > 100 ? "gold" : ""}">${l.n > 100 ? "T" + (l.n - 100) : l.n}</span><span style="flex:1;display:flex;flex-direction:column;min-width:0;gap:2px"><span>${l.n > 100 ? esc(l.title) : rich(l.title)}</span><span class="muted small">${l.livre ? "Livre p. " + esc(l.livre) + " · " : ""}${nr ? nr + " règle" + (nr > 1 ? "s" : "") + " · " : ""}${ne} questions${l.mots.length ? " · " + l.mots.length + " mots" : ""}</span></span></button>`; }).join("")}</div>`;
function exBlock(b, li, bi){
  const key = li + ":" + bi, open = S.topen[key] || {};
  return `<section class="panel stack"><div><p class="eyebrow">${b.n === "T" ? "Test" : "Exercice " + esc(b.n)}</p><h2>${rich(b.title || "")}</h2>${b.instr ? `<p class="muted small">${rich(b.instr)}</p>` : ""}</div>
    <div>${b.items.map(([k, q, a]) => `<div class="exi"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span class="pill">${k}</span><div style="flex:1;min-width:0">${tline(q)}</div></div>
      ${open[k] ? `<div class="exa">${a ? tline(a) : `<p class="muted small">Pas de corrigé pour celle-ci.</p>`}</div>` : `<button class="chip" style="align-self:flex-start" data-a="topen" data-k="${key}" data-n="${k}">Voir la correction</button>`}</div>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-a="topen" data-k="${key}" data-n="*">Tout corriger</button><button class="btn ghost" data-a="tclose" data-k="${key}">Tout cacher</button></div></section>`;
}
VIEWS.tles = () => { const l = tLes(), li = C.TAB.indexOf(l);
  const head = `<div class="stack" style="gap:4px"><p class="eyebrow">${l.n > 100 ? "Test" : "Leçon " + l.n}${l.livre ? " · livre p. " + esc(l.livre) : ""}</p><h2 style="font-size:22px">${rich(l.title)}</h2></div>`;
  const mots = l.mots.length ? `<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>Les mots de la leçon</h2><span class="pill">${l.mots.length}</span></div>
    <div class="row"><button class="btn primary" style="flex:1" data-a="tmots" data-m="start">Réviser ces mots</button><button class="btn ghost" style="flex:1" data-a="tmots" data-m="test">Tester ma maîtrise</button></div>
    <details><summary>Voir la liste</summary><div class="list" style="margin-top:6px">${l.mots.map(([fr, ar]) => `<div class="item"><div class="txt"><span class="ar">${esc(ar)}</span><span class="muted small">${esc(fr)}</span></div>${spk(ar)}</div>`).join("")}</div></details></section>` : "";
  const LBL = {livre: "Corrections de ce que tu as écrit dans ton livre", parle: "🗣 Je parle — à voix haute", atoi: "✍ À toi", txt: "À savoir", corr: "Corrigé"};
  const body = l.blocks.map((b, bi) => {
    if (b.t === "regle") return `<section class="panel stack"><p class="eyebrow">Règle ${esc(b.n)}</p><h2>${rich(b.title || "")}</h2>${b.lines.map(tline).join("")}</section>`;
    if (b.t === "ex") return exBlock(b, li, bi);
    const lines = (b.lines || []).map(tline).join("") + (b.ans || []).map(([k, a]) => `<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span class="pill">${k}</span><div style="flex:1;min-width:0">${tline(a)}</div></div>`).join("");
    if (!lines) return "";
    const title = b.t === "corr" ? b.title : LBL[b.t] || b.title || "";
    return `<details class="panel"${b.t === "txt" ? " open" : ""}><summary><b style="font-weight:500">${rich(title)}</b></summary><div class="stack" style="margin-top:8px">${lines}</div></details>`;
  }).join("");
  const prev = li > 0 ? `<button class="btn ghost" style="flex:1" data-a="tles" data-i="${li - 1}">‹ Précédente</button>` : "", next = li < C.TAB.length - 1 ? `<button class="btn ghost" style="flex:1" data-a="tles" data-i="${li + 1}">Suivante ›</button>` : "";
  return `<div class="stack">${head}${mots}${body}<div class="row">${prev}${next}</div></div>`;
};


/* =====================================================================
   RÈGLE PAR RÈGLE : sharḥ (explication écrite), entraînement séparé,
   tests mélangés. Chaque règle = {id, t, sh, ex, gen?, qs?, dos?}
   ===================================================================== */
const NF = s => String(s).normalize("NFC");
const pick = a => a[rnd(a.length)];
const SOLAR = "تثدذرزسشصضطظلن";

      return Q({q: `Quelle est la bonne écriture de « ${n.frd} » ?`, right: n.def, wrong: [sol ? NF("الْ" + setCase(n.ind, "ُ")) : NF("ال" + n.ind[0] + "ّ" + setCase(n.ind, "ُ").slice(1))], why: sol ? "Solaire : pas de sukūn sur le ل, shadda sur la lettre suivante." : "Lunaire : sukūn sur le ل, pas de shadda."}); }, [6, 9]),
  TR("t10","10","Après فِي / عَلَى / مِنْ / إِلَى, le nom prend la kasra",
    ["Ces petits mots sont des prépositions (حُرُوفُ الْجَرِّ). Le nom qui vient juste après change sa voyelle finale : ـُ devient ـِ. On dit qu'il est مَجْرُورٌ.",
     "مِنْ + الـ devient مِنَ الْـ (« mina l-bayti ») pour pouvoir enchaîner."],
    [["الْبَيْتُ ← فِي الْبَيْتِ","la maison → dans la maison"],["الْمَكْتَبُ ← عَلَى الْمَكْتَبِ","le bureau → sur le bureau"],["الْبَيْتُ ← مِنَ الْبَيْتِ","la maison → de la maison"]],
    () => { const P = pick([["فِي","dans"],["عَلَى","sur"],["مِنْ","de"],["إِلَى","vers"]]), n = pick([...NM_T, ...NF_T]), mi = P[0] === "مِنْ" ? "مِنَ" : P[0];
      return Q({q: `${P[0]} ___ (${n.def})`, fr: `${P[1]} + ${n.frd}`, right: `${mi} ${setCase(n.def, "ِ")}`, wrong: [`${mi} ${n.def}`, `${mi} ${setCase(n.def, "َ")}`, `${mi} ${setCase(n.def, "ٍ")}`], why: "Après une préposition : kasra (ـِ)." + (P[0] === "مِنْ" ? " Et مِنْ devient مِنَ devant الـ." : "")}); }, [10]),
  TR("t11","11","أَيْنَ ؟ = « où ? »",
    ["On répond avec le pronom (هُوَ ou هِيَ) + une préposition + le lieu à la kasra."],
    [["أَيْنَ مُحَمَّدٌ؟ هُوَ فِي الْغُرْفَةِ.","Où est Mohammed ? Il est dans la chambre."],["أَيْنَ السَّاعَةُ؟ هِيَ عَلَى السَّرِيرِ.","Où est la montre ? Elle est sur le lit."]],
    () => { const n = pick([...NM_P, ...NF_P, ...PORT()]), pl = pick(PLACES);
      return Q({q: `أَيْنَ ${n.def}؟`, fr: `Où est ${n.frd} ? (dans ${pl.fr})`, right: `${pron(n)} فِي ${setCase(pl.def, "ِ")}.`, wrong: [`${n.g === "f" ? "هُوَ" : "هِيَ"} فِي ${setCase(pl.def, "ِ")}.`, `${pron(n)} فِي ${pl.def}.`, `${pron(n)} ${setCase(pl.def, "ِ")}.`], why: `${n.def} est ${n.g === "f" ? "féminin → هِيَ" : "masculin → هُوَ"}, puis فِي + lieu à la kasra.`}); }, [11]),
  TR("t12","12","هُوَ (il) ou هِيَ (elle) ?",
    ["En arabe, les objets aussi sont masculins ou féminins. Un mot qui finit par ـَة est féminin → هِيَ. Sinon, le plus souvent, il est masculin → هُوَ.",
     "Féminins sans ة à apprendre : أُمٌّ، بِنْتٌ، أُخْتٌ، عَيْنٌ، أُذُنٌ، يَدٌ، رِجْلٌ، قِدْرٌ، الشَّمْسُ (les parties du corps qui vont par deux sont féminines)."],
    [["أَيْنَ السَّاعَةُ؟ هِيَ عَلَى السَّرِيرِ.","Où est la montre ? Elle est sur le lit."],["أَيْنَ الْوَرَقُ؟ هُوَ عَلَى الْمَكْتَبِ.","Où est le papier ? Il est sur le bureau."]],
    () => { const n = pick([...NM_T, ...NF_T, ...NF_X, ...NF_X, ...NM_P, ...NF_P]); return Q({q: `${n.def} ← ؟`, fr: `Quel pronom remplace « ${n.frd} » ?`, right: pron(n), wrong: [n.g === "f" ? "هُوَ" : "هِيَ"], why: n.g === "f" ? (n.ind.includes("ة") ? "Il finit par ة : féminin → هِيَ." : "Féminin sans ة, à retenir par cœur → هِيَ.") : "Masculin → هُوَ."}); }, [12]),
  TR("t13","13","Les prénoms : tanwīn ou pas ?",
    ["Les prénoms masculins arabes prennent le tanwīn : مُحَمَّدٌ، خَالِدٌ، عَلِيٌّ.", "Les prénoms féminins n'en prennent pas, une seule ḍamma : فَاطِمَةُ، زَيْنَبُ، مَرْيَمُ."],
    [["هَذَا مُحَمَّدٌ.","Voici Mohammed."],["هَذِهِ فَاطِمَةُ.","Voici Fatima."]],
    () => { const nm = pick([...NAMES_M, ...NAMES_F]); return Q({q: `Quelle est la bonne écriture du prénom « ${nm.fr} » ?`, right: nm.nom, wrong: [nm.wrong], why: nm.g === "m" ? "Prénom masculin : tanwīn." : "Prénom féminin : une seule ḍamma, pas de tanwīn."}); }, [13]),
  TR("t14","14","مِنْ أَيْنَ ؟ (d'où ?) et إِلَى (vers)",
    ["مِنْ = de (origine), إِلَى = vers, à. Les deux mettent le nom à la kasra. مِنْ devient مِنَ devant الـ."],
    [["مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنَ الْيَابَانِ.","D'où es-tu ? Je suis du Japon."],["أَيْنَ ذَهَبَ؟ ذَهَبَ إِلَى الْمُدِيرِ.","Où est-il allé ? Chez le directeur."]],
    () => { const k = rnd(3);
      if (k === 0) { const c = pick(COUNTRIES); return Q({q: `مِنْ أَيْنَ أَنْتَ؟`, fr: `D'où es-tu ? (Je suis ${c.fr}.)`, right: `أَنَا مِنَ ${setCase(c.def, "ِ")}.`, wrong: [`أَنَا مِنْ ${c.def}.`, `أَنَا إِلَى ${setCase(c.def, "ِ")}.`, `أَنَا مِنَ ${c.def}.`], why: "مِنْ (origine) → مِنَ devant الـ, et le pays à la kasra."}); }
      const out = k === 2, p = pick(out ? PLACES.map(x => ({def: x.def, frd: x.fr})) : [...NM_P, ...PLACES.map(x => ({def: x.def, frd: x.fr}))]);
      return Q({q: out ? `Traduis : « Il est sorti ${deFr(p.frd)}. »` : `Traduis : « Il est allé ${p.ind ? "chez " + p.frd : aFr(p.frd)}. »`, right: out ? `خَرَجَ مِنَ ${setCase(p.def, "ِ")}.` : `ذَهَبَ إِلَى ${setCase(p.def, "ِ")}.`, wrong: out ? [`خَرَجَ إِلَى ${setCase(p.def, "ِ")}.`, `خَرَجَ مِنْ ${p.def}.`, `خَرَجَ مِنَ ${p.def}.`] : [`ذَهَبَ مِنَ ${setCase(p.def, "ِ")}.`, `ذَهَبَ إِلَى ${p.def}.`, `ذَهَبَ ${p.def}.`], why: out ? "Sortir de : خَرَجَ مِنَ + kasra." : "Aller vers : ذَهَبَ إِلَى + kasra."}); }, [14]),
  TR("t15","15","L'iḍāfa : « le X de Y » (nom + nom)",
    ["Pour dire « le livre de Mohammed », on colle deux noms : كِتَابُ مُحَمَّدٍ. Le 1er s'appelle الْمُضَافُ, le 2e الْمُضَافُ إِلَيْهِ.",
     "1er mot : jamais de الـ, jamais de tanwīn, une seule voyelle (ـُ). 2e mot : toujours à la kasra (مُحَمَّدٍ, الْمُدَرِّسِ). Un prénom féminin prend une fatḥa à la place : مَدْرَسَةُ سَمِيرَةَ.",
     "Les 3 erreurs à éviter : الـ sur le 1er mot, tanwīn sur le 1er mot, 2e mot qui n'est pas à la kasra."],
    [["كِتَابُ مُحَمَّدٍ","le livre de Mohammed"],["قَلَمُ الْمُدَرِّسِ","le stylo de l'enseignant"],["بَابُ الْمَسْجِدِ مَفْتُوحٌ.","La porte de la mosquée est ouverte."]],
    () => { const t = pick(PORT()), owner = Math.random() < .5 ? pick(NM_P) : pick([...NAMES_M, ...NAMES_F]);
      const og = owner.def ? setCase(owner.def, "ِ") : owner.gen, on = owner.def ? owner.def : owner.nom, ofr = owner.def ? owner.frd : owner.fr;
      return Q({q: `Traduis : « ${t.frd} ${deFr(ofr)} »`, right: `${setCase(t.ind, "ُ")} ${og}`, wrong: [`${t.def} ${og}`, `${t.ind} ${og}`, `${setCase(t.ind, "ُ")} ${on}`], why: "1er mot sans الـ ni tanwīn, 2e mot au cas indirect (kasra ; fatḥa pour un prénom féminin)."}); }, [15, 16]),
  TR("t16","16","« De qui ? » : كِتَابُ مَنْ هَذَا ؟",
    ["On met مَنْ à la place du 2e mot de l'iḍāfa : كِتَابُ مَنْ هَذَا؟ = « À qui est ce livre ? ». On répond avec l'iḍāfa complète."],
    [["كِتَابُ مَنْ هَذَا؟ هَذَا كِتَابُ حَامِدٍ.","À qui est ce livre ? C'est le livre de Hamid."],["ابْنُ مَنْ أَنْتَ؟ أَنَا ابْنُ الْمُدَرِّسِ.","De qui es-tu le fils ? Je suis le fils de l'enseignant."]],
    () => { const t = pick(PORT()), nm = pick([...NAMES_M, ...NAMES_F]), c = setCase(t.ind, "ُ");
      if (Math.random() < .5) return Q({q: `Pose la question : « À qui est ${ceFr(t)} ? »`, right: `${c} مَنْ ${dem(t)}؟`, wrong: [`${t.def} مَنْ ${dem(t)}؟`, `مَنْ ${c} ${dem(t)}؟`, `${t.ind} مَنْ ${dem(t)}؟`], why: "Nom sans الـ ni tanwīn + مَنْ + هَذَا / هَذِهِ."});
      return Q({q: `${c} مَنْ ${dem(t)}؟`, fr: `(C'est à ${nm.fr}.)`, right: `${dem(t)} ${c} ${nm.gen}.`, wrong: [`${dem(t)} ${c} ${nm.nom}.`, `${dem(t)} ${t.def} ${nm.gen}.`, `${dem(t)} ${t.ind} ${nm.nom}.`], why: "Réponse avec l'iḍāfa : le 2e mot au cas indirect."}); }, [17]),
  TR("t17","17","يَا + nom : appeler quelqu'un",
    ["Pour appeler : يَا + le nom avec une seule ḍamma, sans tanwīn. مُحَمَّدٌ → يَا مُحَمَّدُ. Ça marche aussi avec un nom commun : يَا أُسْتَاذُ (Monsieur !)."],
    [["يَا مُحَمَّدُ","Ô Mohammed !"],["يَا أُسْتَاذُ","Monsieur ! (au professeur)"],["أَكِتَابُ مُحَمَّدٍ هَذَا يَا يَاسِرُ؟","Est-ce le livre de Mohammed, Yasser ?"]],
    () => { const nm = Math.random() < .7 ? pick([...NAMES_M, ...NAMES_F]) : (x => ({nom: x.ind, voc: setCase(x.ind, "ُ"), fr: x.fr.replace(/^une? /, "")}))(pick(NM_P));
      return Q({q: `Appelle : ${nm.fr}`, right: `يَا ${nm.voc}`, wrong: [`يَا ${setCase(nm.nom, "ٌ")}`, `يَا ${setCase(nm.nom, "َ")}`, `يَا ${setCase(nm.nom, "ِ")}`], why: "يَا + une seule ḍamma, sans tanwīn."}); }, [18]),
  TR("t18","18","L'alif de ابْنٌ et اسْمٌ (hamzat al-waṣl)",
    ["Dans ابْنٌ (fils), اسْمٌ (nom) et الـ, le alif du début ne se prononce qu'en début de phrase (« i », ou « a » pour الـ).",
     "Au milieu de la phrase, on le saute : on enchaîne avec la voyelle d'avant."],
    [["ابْنُ مُحَمَّدٍ فِي الْعِرَاقِ.","« ibnou » : début de phrase, on prononce le alif."],["وَابْنُ حَامِدٍ فِي الْهِنْدِ.","« wa-bnou » : milieu, on le saute."],["مَا اسْمُ الرَّجُلِ؟","« ma-smou r-rajouli » : on le saute."]],
    null, []),
  TR("t19","19","هَذِهِ = « ceci » pour le féminin",
    ["هَذَا pour un mot masculin, هَذِهِ pour un mot féminin. Même chose dans les questions : مَنْ هَذِهِ؟ مَا هَذِهِ؟",
     "Un mot est féminin s'il finit par ـَة (ou ـَاة comme مِكْوَاةٌ), ou s'il fait partie des féminins sans ة : أُمٌّ، بِنْتٌ، أُخْتٌ، عَيْنٌ، أُذُنٌ، يَدٌ، رِجْلٌ، قِدْرٌ… et les prénoms féminins."],
    [["مَا هَذِهِ؟ هَذِهِ مِكْوَاةٌ.","Qu'est-ce que c'est ? C'est un fer à repasser."],["هَذَا ابْنُ حَامِدٍ وَهَذِهِ بِنْتُ يَاسِرٍ.","Voici le fils de Hamid et voici la fille de Yasser."]],
    () => { const n = pick([...NF_T, ...NF_X, ...NF_P, ...NM_T, ...NM_P]); return Q({q: `Montre-le (proche) : ${n.ind}`, fr: `« C'est ${n.fr}. »`, right: `${dem(n)} ${n.ind}.`, wrong: [`${n.g === "f" ? "هَذَا" : "هَذِهِ"} ${n.ind}.`, `${dem(n)} ${n.def}.`, `${n.g === "f" ? "تِلْكَ" : "ذَلِكَ"} ${n.ind}.`], why: n.g === "f" ? "Mot féminin, proche : هَذِهِ." : "Mot masculin, proche : هَذَا."}); }, [19]),
  TR("t20","20","L'accord : sujet féminin → khabar en ـَة",
    ["Si le sujet est féminin, le mot qui le décrit prend aussi ـَةٌ : الْبَابُ مُغْلَقٌ → النَّافِذَةُ مُغْلَقَةٌ.", "C'est vrai même avec un féminin sans ة : الشَّمْسُ جَمِيلَةٌ، الْيَدُ وَسِخَةٌ، الْأُمُّ جَالِسَةٌ."],
    [["النَّافِذَةُ مُغْلَقَةٌ.","La fenêtre est fermée."],["فَاطِمَةُ طَبِيبَةٌ.","Fatima est médecin."],["هِيَ مُسْلِمَةٌ.","Elle est musulmane."]],
    () => { const n = pick([...NF_T, ...NF_X.slice(0, 5)]), a = adjFor(n); return Q({q: `Traduis : « ${cap(n.frd)} est ${frAdj(n, a)}. »`, right: `${n.def} ${adjF(a.ind)}.`, wrong: [`${n.def} ${a.ind}.`, `${n.def} ${nDef(adjF(a.ind))}.`, `${n.ind} ${adjF(a.ind)}.`], why: `${n.def} est féminin, donc le khabar aussi : ${adjF(a.ind)}.`}); }, [20]),
  TR("t21","21","لِمَنْ ؟ = « à qui ? » → لِـ + nom à la kasra",
    ["لِـ (à, pour) se colle au nom, qui prend la kasra. Avec الـ, le alif tombe : لِـ + الْمُدِيرِ → لِلْمُدِيرِ.",
     "Deux façons de dire la même chose : هَذَا كِتَابُ مُحَمَّدٍ (iḍāfa) = هَذَا الْكِتَابُ لِمُحَمَّدٍ (avec لِـ)."],
    [["لِمَنْ هَذِهِ؟ هَذِهِ لِخَالِدٍ.","À qui est-ce ? C'est à Khalid."],["هَذِهِ السَّيَّارَةُ لِلطَّبِيبِ.","Cette voiture est au médecin."],["الْحَمْدُ لِلَّهِ.","La louange est à Allah."]],
    () => { const t = pick(PORT()), o = pick(NM_P); return Q({q: `لِمَنْ ${dem(t)} ${t.def}؟`, fr: `À qui est ${ceFr(t)} ? (${aFr(o.frd)})`, right: `${dem(t)} ${t.def} ${liD(o.def)}.`, wrong: [`${dem(t)} ${t.def} لِ${o.def}.`, `${dem(t)} ${t.def} ${NF("لِ" + o.def.slice(1))}.`, `${dem(t)} ${t.def} لِ ${setCase(o.ind, "ٍ")}.`], why: "لِـ + الـ → لِلْـ (le alif tombe), et le nom à la kasra.", alts: [`${dem(t)} ${setCase(t.ind, "ُ")} ${setCase(o.def, "ِ")}.`]}); }, [21]),
  TR("t22","22","تِلْكَ = « cela » pour le féminin (loin)",
    ["Proche : هَذَا (m) · هَذِهِ (f). Loin : ذَلِكَ (m) · تِلْكَ (f).", "Les féminins sans ة restent féminins : تِلْكَ عَيْنٌ، تِلْكَ أُمٌّ."],
    [["هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ.","Celle-ci est médecin et celle-là infirmière."],["ذَلِكَ دِيكٌ وَتِلْكَ دَجَاجَةٌ.","Cela est un coq et cela une poule."]],
    () => { const n = pick([...NF_T, ...NF_X, ...NF_P, ...NM_T, ...NM_P]), far = Math.random() < .7, right = (n.g === "f" ? (far ? "تِلْكَ" : "هَذِهِ") : (far ? "ذَلِكَ" : "هَذَا"));
      return Q({q: `${far ? "Loin" : "Proche"} : ${n.ind}`, fr: `« ${far ? "Cela" : "Ceci"}, c'est ${n.fr}. »`, right: `${right} ${n.ind}.`, wrong: ["هَذَا", "هَذِهِ", "ذَلِكَ", "تِلْكَ"].filter(x => x !== right).map(x => `${x} ${n.ind}.`), why: `${n.g === "f" ? "Féminin" : "Masculin"} + ${far ? "loin" : "proche"} : ${right}.`}); }, [22, 23]),
  TR("t23","23","هَذَا الرَّجُلُ = « cet homme » (≠ هَذَا رَجُلٌ)",
    ["هَذَا رَجُلٌ = « C'est un homme. » : une phrase complète.", "هَذَا الرَّجُلُ = « Cet homme… » : il faut compléter la phrase : هَذَا الرَّجُلُ تَاجِرٌ = « Cet homme est commerçant »."],
    [["هَذَا الرَّجُلُ تَاجِرٌ وَذَلِكَ الرَّجُلُ طَبِيبٌ.","Cet homme-ci est commerçant et cet homme-là médecin."],["هَذَا الْكِتَابُ جَدِيدٌ.","Ce livre est neuf."]],
    () => { const n = pick(NM_T), a = adjFor(n), full = Math.random() < .6;
      if (!full) return Q({q: `Traduis : « C'est ${n.fr}. »`, right: `هَذَا ${n.ind}.`, wrong: [`هَذَا ${n.def}.`, `هَذَا ${n.def} ${a.ind}.`], why: "Phrase complète « c'est un… » : هَذَا + nom avec tanwīn."});
      const ce = ceFr(n);
      return Q({q: `Traduis : « ${cap(ce)} est ${frAdj(n, a)}. »`, right: `هَذَا ${n.def} ${a.ind}.`, wrong: [`هَذَا ${n.ind} ${a.ind}.`, `هَذَا ${n.def} ${a.def}.`, `${n.def} هَذَا ${a.ind}.`], why: "« Ce X » = هَذَا + nom avec الـ, puis le khabar avec tanwīn."}); }, [24]),
  TR("t24","24","أَمَامَ · خَلْفَ · تَحْتَ · عِنْدَ + nom à la kasra",
    ["Ces mots de lieu fonctionnent comme une iḍāfa : le nom qui suit prend la kasra.", "أَمَامَ = devant · خَلْفَ = derrière · تَحْتَ = sous · عِنْدَ = chez, auprès de."],
    [["بَيْتُ التَّاجِرِ أَمَامَ الْمَسْجِدِ.","La maison du commerçant est devant la mosquée."],["الْحَقِيبَةُ تَحْتَ الْمَكْتَبِ.","Le sac est sous le bureau."],["الْمُدَرِّسُ عِنْدَ الْمُدِيرِ.","L'enseignant est chez le directeur."]],
    () => { const A = [["أَمَامَ","devant"],["خَلْفَ","derrière"],["تَحْتَ","sous"]], ad = pick(A), a = pick(PORT().filter(x => !FURN().includes(x))), b = pick(FURN()), other = pick(A.filter(x => x !== ad));
      return Q({q: `Traduis : « ${cap(a.frd)} est ${ad[1]} ${b.frd}. »`, right: `${a.def} ${ad[0]} ${setCase(b.def, "ِ")}.`, wrong: [`${a.def} ${ad[0]} ${b.def}.`, `${a.def} ${other[0]} ${setCase(b.def, "ِ")}.`, `${a.ind} ${ad[0]} ${setCase(b.def, "ِ")}.`], why: `${ad[0]} = ${ad[1]}, et le nom qui suit à la kasra.`}); }, [25]),
  TR("t25","25","Les mots en ـَى / ـَا ne changent jamais",
    ["Les noms qui finissent par un alif (أَمْرِيكَا، فَرَنْسَا، أَلْمَانِيَا…) ou par ى (الْمُسْتَشْفَى، عِيسَى، مُوسَى) ne prennent aucune voyelle finale, même après فِي، مِنْ، إِلَى، لِـ."],

function ruleQ(sid, r){

  if (r.selfgen && roll < .18) return {...r.selfgen(), self: true, rid: r.id};
  if (dos.length && roll < .3) { const d = pick(dos); return {self: true, q: d[1], a: d[2], instr: d[0], rid: r.id}; }
  if (r.gen && (!r.qs || !r.qs.length || roll < .7)) { try { const q = r.gen(); if (q && q.opts && q.opts.includes(q.right)) return {...q, rid: r.id}; } catch (e) {} }
  if (r.qs && r.qs.length) return {...fromR(pick(r.qs)), rid: r.id};
  if (dos.length) { const d = pick(dos); return {self: true, q: d[1], a: d[2], instr: d[0], rid: r.id}; }
  return r.gen ? {...r.gen(), rid: r.id} : null;
}

}

VIEWS.review = () => {
  const s = S.sess; if (!s) return VIEWS.today();
  const map = Object.fromEntries(cards(s.sp).map(c => [c.id, c]));
  s.queue = s.queue.filter(id => map[id]);
  if (!s.queue.length && s.test) {
    const score = s.total - s.wrong.length, pct = Math.round(100 * score / s.total);
    if (!s.saved) { s.saved = true; put("mt-" + s.sp + "-" + hsh(s.th || "*"), {k: "mast", sp: s.sp, th: s.th || "", score, total: s.total, at: now()}); }
    const all = Object.fromEntries(cards(s.sp).map(c => [c.id, c]));
    return `<div class="stack"><div class="empty panel"><span class="ar">${pct >= 90 ? "مُمْتَاز" : "وَاصِلْ"}</span><h2>${score} / ${s.total} · ${pct} %</h2><p class="muted">${pct >= 90 ? "Maîtrisé. Refais le test dans une semaine pour vérifier que ça tient." : "Pas encore maîtrisé. Revois les mots ratés, puis refais le test."}</p></div>
      ${s.wrong.length ? `<section class="panel"><p class="eyebrow">À revoir</p><div class="list">${s.wrong.map(id => all[id]).filter(Boolean).map(c => `<div class="item"><div class="txt"><span class="${s.sp === "ar" ? "ar" : ""}" dir="auto">${esc(c.f)}</span><span class="muted small" dir="auto">${esc(c.b)}</span></div></div>`).join("")}</div></section>
      <button class="btn primary block" data-a="retry">Revoir les ratés</button>` : ""}
      <button class="btn ghost block" data-a="go" data-v="${s.from}">Retour</button></div>`;
  }
  if (!s.queue.length) return `<div class="empty panel"><span class="ar">أَحْسَنْتَ</span><h2>Séance terminée</h2><p class="muted">${s.done} réponses. Les cartes reviendront au bon moment.</p><button class="btn primary" data-a="go" data-v="${s.from}">Retour</button></div>`;
  const c = map[s.queue[0]], isAr = s.sp === "ar" || s.sp === "r-voc";
  if (s.curFor !== c.id) { s.curFor = c.id; s.rev = s.dir === "fr" || (s.dir === "mix" && Math.random() < .5); s.optsFor = null; }
  const front = s.rev ? c.b : c.f, back = s.rev ? c.f : c.b;
  const fClass = (isAr && !s.rev) ? "ar big" : "big", bClass = (isAr && s.rev) ? "ar" : "";
  const pct = Math.round(100 * s.done / (s.done + s.queue.length));
  if (s.mode === "qcm" && s.optsFor !== c.id) {
    const allc = cards(s.sp).filter(x => x.id !== c.id), near = allc.filter(x => x.th === c.th && x.g === c.g);
    const val = x => s.rev ? x.f : x.b, uniq = arr => [...new Set(arr.map(val))].filter(x => x !== back && stripH(x) !== stripH(back));
    let pool = shuffle(uniq(near)).slice(0, 3); if (pool.length < 3) pool = pool.concat(shuffle(uniq(allc)).filter(x => !pool.includes(x))).slice(0, 3);
    s.opts = [back, ...pool].sort(() => Math.random() - .5); s.right = back; s.optsFor = c.id; s.picked = null;
  }
  const qcm = s.mode === "qcm";
  return `<div class="stack">
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="muted small">${s.queue.length} restantes${c.th ? " · " + esc(c.th) : ""}</span>
      <div class="row">${isAr ? "" : `<button class="chip ${s.write ? "on" : ""}" data-a="writemode">Écrire de mémoire</button>`}</div></div>
    ${isAr ? `<div class="chips">${[["flip","Je dis le sens"],["qcm","Choix"]].map(([m, l]) => `<button class="chip ${s.mode === m ? "on" : ""}" data-a="armode" data-m="${m}">${l}</button>`).join("")}<span style="width:8px;flex:none"></span>${[["ar","ع → FR"],["fr","FR → ع"],["mix","Mélangé"]].map(([m, l]) => `<button class="chip ${s.dir === m ? "on" : ""}" data-a="setdir" data-m="${m}">${l}</button>`).join("")}</div>` : ""}
    <div class="card">
      <div class="${fClass}" dir="auto" style="${fClass.includes("ar") ? "" : "font-size:22px;line-height:1.5"}">${esc(front)}</div>
      ${isAr && !s.rev ? spk(c.f) : ""}
      ${s.write && !s.shown ? `<textarea id="typed" dir="auto" placeholder="Écris la réponse de mémoire, puis compare">${esc(s.typed)}</textarea>` : ""}
      ${s.shown ? `<div class="ans stack">${s.write && s.typed ? `<div><p class="eyebrow">Ta réponse</p><p dir="auto">${esc(s.typed)}</p></div><p class="eyebrow">Réponse</p>` : ""}<div class="${bClass}" dir="auto" style="font-size:${bClass ? 28 : 19}px">${esc(back)}</div>${c.x ? `<div style="color:var(--muted)">${c.xl ? `<span class="small">${c.xl} : </span>` : ""}<bdi class="ar" style="font-size:24px">${esc(c.x)}</bdi></div>` : ""}${isAr && s.rev ? spk(c.f) : ""}${c.ex ? `<div class="stack" style="gap:2px;margin-top:6px"><div class="row" style="flex-wrap:nowrap"><span class="ar" style="font-size:21px;flex:1">${esc(c.ex)}</span>${spk(c.ex)}</div><span class="muted small">${esc(c.ext || "")}</span></div>` : ""}</div>` : ""}
    </div>
    ${qcm ? `<div class="opts">${s.opts.map(o => `<button class="opt ${s.rev ? "" : "fr"} ${s.picked ? (o === s.right ? "right" : (o === s.picked ? "wrong" : "")) : ""}" data-a="rpick" data-o="${esc(o)}" ${s.picked ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
      <button class="btn ghost block" data-a="rpick" data-o="__idk" ${s.picked ? "disabled" : ""}>Je ne sais pas</button>
      ${s.picked ? `<button class="btn primary block" data-a="qnext">Suivant</button>` : ""}`
    : s.shown
      ? `<div class="grades"><button class="btn g0" data-a="grade" data-g="0">Raté<small>revient vite</small></button><button class="btn g1" data-a="grade" data-g="1">Difficile<small>bientôt</small></button><button class="btn g2" data-a="grade" data-g="2">Bon<small>plus tard</small></button></div>`
      : `<button class="btn primary block" data-a="show">Afficher la réponse</button>`}
  </div>`;
};

      <label class="f">Sens<input type="text" id="vf" placeholder="s'asseoir"></label>
      <button class="btn primary" data-a="addverb">Ajouter le verbe</button>
      <details><summary>Coller toute ta liste de verbes</summary><div class="stack" style="margin-top:8px"><p class="muted small">Un verbe par ligne : māḍī | muḍāriʿ | sens.</p><textarea id="vbulk" dir="auto" placeholder="جَلَسَ | يَجْلِسُ | s'asseoir"></textarea><button class="btn" data-a="vbulk">Importer les verbes</button></div></details>

function newQ(){
  const day = setting("sfDay", 0), verbs = allVerbs().filter(v => canConj(v) && (!day || !v.n || Math.ceil(v.n / 10) <= day));
  const v = verbs[Math.floor(Math.random() * verbs.length)];
  const tense = ["madi", "mudari", "madi", "mudari", "sa", "sawfa", "lam", "amr"][Math.floor(Math.random() * 8)];
  const forms = conjugate(v, tense), fp = Math.random() < .5;
  const filled = forms.map((f, k) => f ? k : -1).filter(k => k >= 0);
  const ok = filled.filter(k => forms.filter(f => f === forms[k]).length === 1 && ![3, 6, 9, 12].includes(k));
  const i = fp ? ok[Math.floor(Math.random() * ok.length)] : filled[Math.floor(Math.random() * filled.length)];
  const right = fp ? PRON[i][0] : forms[i];
  const pool = fp ? shuffle(ok.map(k => PRON[k][0]).filter(x => x !== right)) : shuffle([...new Set(forms.filter(f => f && f !== right))]);
  S.sf.q = {v, tense, i, fp, right, form: forms[i], opts: shuffle([right, ...pool.slice(0, 3)]), picked: null};
}
function qcmView(){
  const sf = S.sf; if (!sf.q) newQ();
  const q = sf.q, finished = sf.goal && sf.total >= sf.goal;
  if (finished) return `<div class="empty panel"><span class="ar">${sf.score >= sf.total * .8 ? "مُمْتَاز" : "وَاصِلْ"}</span><h2>${sf.score} / ${sf.total}</h2><p class="muted">${sf.score >= sf.total * .8 ? "Très bien maîtrisé." : "Refais une série demain, la régularité paie."}</p><button class="btn primary" data-a="sfreset">Nouvelle série</button></div>`;
  return `<div class="row" style="justify-content:space-between"><span class="pill good">${sf.score} / ${sf.total}${sf.goal ? " · série de " + sf.goal : ""}</span><span class="muted small">${esc(q.v.fr)}</span></div>
    <div class="card" style="min-height:0">
      <span class="eyebrow">${TENSES[q.tense].fr} · ${q.fp ? "quel pronom ?" : "quelle forme ?"}</span>
      <div class="ar" style="font-size:22px;color:var(--muted)">${esc(q.v.madi)} · ${esc(q.v.mudari)}</div>
      <div class="ar big" style="font-size:${q.fp ? 34 : 40}px">${q.fp ? esc(q.form) : PRON[q.i][0] + (PRON[q.i][1] ? ` <span style="font-size:20px">(${PRON[q.i][1]})</span>` : "")}</div>
    </div>
    <div class="opts">${q.opts.map(o => `<button class="opt ${q.picked ? (o === q.right ? "right" : (o === q.picked ? "wrong" : "")) : ""}" data-a="pick" data-o="${esc(o)}" ${q.picked ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
    <button class="btn ghost block" data-a="pick" data-o="__idk" ${q.picked ? "disabled" : ""}>Je ne sais pas</button>
    ${q.picked ? `<div class="row">${spk(q.fp ? q.form : q.right)}<button class="btn primary" style="flex:1" data-a="nextq">Question suivante</button></div>` : ""}`;
}

       ${m.mots && m.mots.length ? `<div class="row">${m.mots.map(w => `<button class="chip" data-a="addw" data-ar="${esc(w.ar)}" data-fr="${esc(w.fr)}"><span class="ar" style="font-size:16px">${esc(w.ar)}</span>&nbsp;+</button>`).join("")}</div>` : ""}</div>`).join("");

    writemode: () => { S.sess.write = !S.sess.write; render(); },
    sfmode: () => { S.sf.mode = d.m; if (d.m === "qcm" && !S.sf.goal) { S.sf.goal = 0; } render(); },
    sarfqcm: () => { Object.assign(S.sf, {mode: "qcm", goal: 10, score: 0, total: 0, q: null}); go("sarf"); },
    sfreset: () => { Object.assign(S.sf, {goal: 10, score: 0, total: 0, q: null}); render(); },
    verb: () => { S.sf.vid = d.id; render(); },
    vstep: () => { const vs = allVerbs(), i = vs.findIndex(x => x.id === S.sf.vid); S.sf.vid = vs[(Math.max(0, i) + (+d.k) + vs.length) % vs.length].id; render(); },
    tense: () => { S.sf.tense = d.t; render(); },
    pick: () => { const q = S.sf.q; q.picked = d.o; S.sf.total++; if (d.o === q.right) S.sf.score++; render(); },
    nextq: () => { S.sf.q = null; render(); },
    addverb: () => {
      const madi = $("#vm").value.trim(), mudari = $("#vp").value.trim(), fr = $("#vf").value.trim();
      if (!madi || !mudari || !fr) return toast("Remplis les trois champs.");
      if (allVerbs().some(v => stripH(v.madi) === stripH(madi))) return toast("Ce verbe est déjà là.");
            const id = "v-" + newId(); put(id, {k: "verb", madi, mudari, fr}); S.sf.vid = id; toast(parseVerb(madi, mudari) ? "Verbe ajouté." : "Verbe ajouté. Il est irrégulier : pas de tableau automatique, mais il est dans les exercices."); render();
    },
    delverb: () => { if (el.dataset.confirm) { remove(d.id); remove("r-vb-" + d.id); S.sf.vid = "b6"; render(); } else { el.dataset.confirm = 1; el.style.color = "var(--bad)"; toast("Touche encore pour supprimer."); } },
    scen: () => { S.cv = {sc: d.id, msgs: [], busy: false, err: ""}; render(); convSend(""); },
    endconv: () => { S.cv = {sc: null, msgs: [], busy: false, err: ""}; render(); },
    send: () => { const t = $("#cin").value.trim(); if (t && !S.cv.busy) convSend(t); },
    sugg: () => { const i = $("#cin"); i.value = (i.value ? i.value + " " : "") + d.t; i.focus(); },
    tr: () => { S.cv.msgs[+d.i].showFr = true; render(); },
    addw: () => addWord(d.ar, d.fr, d.th),
    jcorrect: () => journalCorrect(),
    acca: () => { S.acc.a = +d.i; S.acc.rev = {}; render(); },
    accm: () => { S.acc.m = d.m; S.acc.rev = {}; if (d.m === "h" && !ACC[S.acc.a].hal) S.acc.a = 0; render(); },
    acch: () => { S.acc.hide = !S.acc.hide; S.acc.rev = {}; render(); },
    accrev: () => { S.acc.rev[d.k] = 1; render(); },
    export: async () => {
      const data = JSON.stringify({app: "dars", v: 1, at: new Date().toISOString(), items: Object.fromEntries(Object.entries(S.items).filter(([, x]) => !x.x))}, null, 1);
      try { const dl = window.claude ? await claude.use("downloads") : null; const fn = "dars-sauvegarde-" + todayKey() + ".json"; if (!dl) { const u = URL.createObjectURL(new Blob([data], {type: "application/json"})), l = document.createElement("a"); l.href = u; l.download = fn; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return; } await dl.save({filename: fn, data}); }
      catch (err) { if (err && err.code !== "cancelled" && err.code !== "declined") toast("L'export n'a pas abouti."); }
    }
  };
  if (A[a]) A[a]();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cin") { e.preventDefault(); const t = e.target.value.trim(); if (t && !S.cv.busy) convSend(t); } });
document.addEventListener("input", e => {
  if (e.target.id === "jtxt") { S.jr.draft = e.target.value; S.jr.touched = true; }
  if (e.target.id === "typed" && S.sess) S.sess.typed = e.target.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "npd") setSetting("newPerDay", +t.value);
  if (t.id === "rate") setSetting("rate", +t.value);
  if (t.id === "voice") setSetting("voice", t.value);
  if (t.id === "aufile" && t.files[0]) {
    const f = t.files[0], txt = S.pendAudio; t.value = "";
    if (!txt) return;
    if (f.size > 180000) return toast("Fichier trop lourd : garde un extrait de quelques secondes (moins de 180 Ko).");
    if (!COL) return toast("Ouvre l'appli depuis Claude, connecté, pour garder tes audios.");
    const r = new FileReader();
    r.onload = () => { const b64 = String(r.result).split(",")[1]; delete AUDC["au-" + hsh(txt)]; put("au-" + hsh(txt), {k: "audio", t: txt, type: f.type || "audio/mpeg", data: b64}); toast("Audio ajouté. Touche le haut-parleur pour l'écouter."); render(); };
    r.readAsDataURL(f);
  }
  if (t.id === "jimg" && t.files[0]) { const f = t.files[0]; t.value = ""; journalCorrect(f); }
  if (t.id === "imp" && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try {
      const j = JSON.parse(r.result); if (!j || j.app !== "dars" || !j.items) throw 0;
      let n = 0; for (const [id, doc] of Object.entries(j.items)) { const cur = S.items[id]; if (!cur || (doc.u || 0) > (cur.u || 0)) { S.items[id] = doc; lsSave(); write(id); n++; } }
      toast(n + " éléments importés."); render();
    } catch { toast("Ce fichier n'est pas une sauvegarde Dars."); } };
    r.readAsText(t.files[0]);
  }
});

render();
initCloud();
try { if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
</script>
